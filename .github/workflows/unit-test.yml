name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_LOCKED: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
        architecture: ["x64"]
    name: unittest - Python ${{ matrix.python-version }} on ${{ matrix.architecture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          just ci-install

      - name: Verify Python runtime
        run: |
          uv run --locked python - <<'PY'
          import os
          import sys
          import sysconfig

          import docufix.__main__
          import pytest
          import typing_extensions

          requested = os.environ["UV_PYTHON"]
          expected_version = tuple(map(int, requested.rstrip("t").split(".")))
          assert sys.version_info[:2] == expected_version, sys.version
          assert bool(sysconfig.get_config_var("Py_GIL_DISABLED")) == requested.endswith("t")
          if requested.endswith("t"):
              assert not sys._is_gil_enabled(), "Dependencies must not re-enable the GIL"
          print(sys.version)
          PY

      - name: unit test
        run: |
          just ci-test
